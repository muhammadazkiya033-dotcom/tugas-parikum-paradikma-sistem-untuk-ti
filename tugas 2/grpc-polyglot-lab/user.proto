syntax = "proto3";

package user;

option go_package = "example.com/grpc-polyglot-lab/go-server/pb;pb";

message UserRequest {
  int32 user_id = 1;
}

message UserResponse {
  string name = 1;
  string email = 2;
  string no_hp = 3;
}

service UserService {
  rpc GetUserProfile (UserRequest) returns (UserResponse);
}